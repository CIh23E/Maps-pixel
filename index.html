<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halloween Diorama — Lofi Loop</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;}
  canvas{display:block;position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

/* =========================================================
   CONSTANTS
   ========================================================= */
const W = 480, H = 270, HORIZON = 178;

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
cv.width = W; cv.height = H;

let cur = ctx;

/* =========================================================
   PIXEL DRAWING HELPERS
   ========================================================= */
function rect(x,y,w,h,col){
  cur.fillStyle = col;
  cur.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function pcircle(cx,cy,r,col){
  cur.fillStyle = col;
  cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
  for(let y=-r;y<=r;y++){
    const dx = Math.floor(Math.sqrt(Math.max(0, r*r - y*y)));
    cur.fillRect(cx-dx, cy+y, dx*2+1, 1);
  }
}

function pellipse(cx,cy,rx,ry,col){
  cur.fillStyle = col;
  cx = Math.round(cx); cy = Math.round(cy);
  rx = Math.max(0.6, rx); ry = Math.max(0.6, ry);
  const iry = Math.round(ry);
  for(let y=-iry;y<=iry;y++){
    const k = 1 - (y*y)/(ry*ry);
    if(k < 0) continue;
    const dx = Math.floor(rx*Math.sqrt(k));
    cur.fillRect(cx-dx, cy+y, dx*2+1, 1);
  }
}

function ptri(x1,y1,x2,y2,x3,y3,col){
  cur.fillStyle = col;
  const minY = Math.floor(Math.min(y1,y2,y3));
  const maxY = Math.ceil (Math.max(y1,y2,y3));
  const e = [[x1,y1,x2,y2],[x2,y2,x3,y3],[x3,y3,x1,y1]];
  for(let y=minY;y<=maxY;y++){
    const xs = [];
    for(let i=0;i<3;i++){
      const ax=e[i][0], ay=e[i][1], bx=e[i][2], by=e[i][3];
      if((ay<=y && by>y) || (by<=y && ay>y)){
        xs.push(ax + (y-ay)/(by-ay)*(bx-ax));
      }
    }
    if(xs.length>=2){
      const a = Math.min(xs[0],xs[1]), b = Math.max(xs[0],xs[1]);
      cur.fillRect(Math.round(a), y, Math.max(1, Math.round(b)-Math.round(a)), 1);
    }
  }
}

function pline(x0,y0,x1,y1,col,thick){
  thick = thick || 1;
  cur.fillStyle = col;
  x0=Math.round(x0); y0=Math.round(y0); x1=Math.round(x1); y1=Math.round(y1);
  const dx = Math.abs(x1-x0), dy = Math.abs(y1-y0);
  const sx = x0<x1?1:-1, sy = y0<y1?1:-1;
  let err = dx-dy;
  const t = Math.max(1, Math.round(thick));
  const o = Math.floor(t/2);
  let guard = 0;
  while(guard++ < 3000){
    cur.fillRect(x0-o, y0-o, t, t);
    if(x0===x1 && y0===y1) break;
    const e2 = 2*err;
    if(e2 > -dy){ err -= dy; x0 += sx; }
    if(e2 <  dx){ err += dx; y0 += sy; }
  }
}

function addGlow(x,y,r,rgb,a){
  if(r < 1 || a <= 0.002) return;
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,    'rgba('+rgb+','+a+')');
  g.addColorStop(0.35, 'rgba('+rgb+','+(a*0.38)+')');
  g.addColorStop(0.7,  'rgba('+rgb+','+(a*0.10)+')');
  g.addColorStop(1,    'rgba('+rgb+',0)');
  ctx.fillStyle = g;
  ctx.fillRect(x-r, y-r, r*2, r*2);
}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

/* =========================================================
   VIEWPORT  — crisp integer-ish cover scaling
   ========================================================= */
function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const s  = Math.max(vw / W, vh / H);          // cover
  const w  = W * s, h = H * s;
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';
  cv.style.left   = ((vw - w) / 2) + 'px';
  cv.style.top    = ((vh - h) / 2) + 'px';
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   FLICKER / NOISE
   ========================================================= */
function flicker(t, phase, speed){
  speed = speed || 1;
  const a = Math.sin(t*2.7*speed + phase);
  const b = Math.sin(t*7.3*speed + phase*2.1);
  const c = Math.sin(t*13.1*speed + phase*3.7);
  return 0.82 + 0.09*a + 0.055*b + 0.035*c;
}
function fireFlicker(t, phase){
  return 0.68
       + 0.16*Math.sin(t*4.3  + phase)
       + 0.10*Math.sin(t*11.7 + phase*2.0)
       + 0.06*Math.sin(t*23.1 + phase*3.0);
}
function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }

/* =========================================================
   STATIC LAYER  (hills, ground, house, trees, graves)
   ========================================================= */
const S    = document.createElement('canvas');
S.width = W; S.height = H;
const sctx = S.getContext('2d');

function ridge(baseY, amp, seed, col, target){
  const r = mulberry32(seed);
  const n = 10;
  const pts = [];
  for(let i=0;i<=n;i++) pts.push(baseY - amp*0.3 - amp*r());
  target.fillStyle = col;
  for(let x=0;x<W;x++){
    const t  = x/(W/n);
    const i  = Math.min(n-1, Math.floor(t));
    const f  = t - i;
    const sf = (1 - Math.cos(f*Math.PI)) / 2;
    const y  = Math.round(pts[i]*(1-sf) + pts[i+1]*sf);
    target.fillRect(x, y, 1, H - y);
  }
}

function tombstone(bx, by, w, h, lean){
  cur.fillStyle = '#15101f';
  for(let i=0;i<h;i++){
    const off = Math.round(lean * i);
    cur.fillRect(bx + off, by - i, w, 1);
  }
  const topOff = Math.round(lean * (h-1));
  cur.fillRect(bx + topOff + 1, by - h - 1, w - 2, 1);
  cur.fillRect(bx + topOff + 2, by - h - 2, Math.max(1,w - 4), 1);
  // cold rim light on the right edge
  cur.fillStyle = '#241d3a';
  for(let i=0;i<h;i++){
    const off = Math.round(lean * i);
    cur.fillRect(bx + off + w - 1, by - i, 1, 1);
  }
  cur.fillStyle = '#100c1a';
  for(let i=0;i<h;i++){
    const off = Math.round(lean * i);
    cur.fillRect(bx + off, by - i, 1, 1);
  }
}

function drawTree(rnd, x, y, ang, len, thick, depth, col){
  if(depth <= 0 || len < 1.6) return;
  const x2 = x + Math.cos(ang)*len;
  const y2 = y + Math.sin(ang)*len;
  pline(x, y, x2, y2, col, thick);

  const n = depth > 5 ? 2 : (rnd() < 0.38 ? 3 : 2);
  for(let i=0;i<n;i++){
    let a = ang + (rnd()-0.5)*1.15;
    const minA = -Math.PI*0.97, maxA = -Math.PI*0.03;
    if(a < minA) a = minA + (minA - a) * 0.4;
    if(a > maxA) a = maxA - (a - maxA) * 0.4;
    a = Math.max(minA, Math.min(maxA, a));
    drawTree(rnd, x2, y2, a, len*(0.66 + rnd()*0.14),
             Math.max(1, thick*0.66), depth-1, col);
  }
}

function buildStatic(){
  cur = sctx;
  sctx.clearRect(0,0,W,H);
  const R = mulberry32(20251031);

  /* ---- distant ridges ---- */
  ridge(168, 15, 101, '#171232', sctx);
  ridge(177,  9, 202, '#0f0b20', sctx);

  /* ---- ground plane ---- */
  const gg = sctx.createLinearGradient(0,180,0,H);
  gg.addColorStop(0,    '#0b0818');
  gg.addColorStop(0.35, '#070510');
  gg.addColorStop(1,    '#040309');
  sctx.fillStyle = gg;
  sctx.fillRect(0,180,W,H-180);

  /* ---- ground speckle ---- */
  for(let i=0;i<520;i++){
    const x = R()*W, y = 182 + R()*(H-182);
    sctx.fillStyle = R() < 0.5 ? 'rgba(255,255,255,0.020)'
                               : 'rgba(0,0,0,0.30)';
    sctx.fillRect(x|0, y|0, 1, 1);
  }

  /* ---- dirt path from the door ---- */
  for(let y=186;y<H;y++){
    const t = (y-186)/(H-186);
    const l = 164 + (110-164)*t;
    const r = 186 + (232-186)*t;
    sctx.fillStyle = '#0d0a18';
    sctx.fillRect(Math.round(l), y, Math.max(1, Math.round(r-l)), 1);
  }
  /* stepping stones */
  for(let i=0;i<7;i++){
    const t = i/6;
    const y = 192 + t*(H-192);
    const l = 164 + (110-164)*((y-186)/(H-186));
    const r = 186 + (232-186)*((y-186)/(H-186));
    const x = l + (r-l)*(0.3 + 0.4*R());
    sctx.fillStyle = '#141020';
    sctx.fillRect(Math.round(x), Math.round(y), 5 + Math.round(R()*5), 2);
    sctx.fillStyle = '#1c1730';
    sctx.fillRect(Math.round(x), Math.round(y), 5 + Math.round(R()*5), 1);
  }

  /* ---- trees (behind the house) ---- */
  const tr1 = mulberry32(777);
  drawTree(tr1,  58, 200, -Math.PI/2, 30, 5, 8, '#0c0816');
  const tr2 = mulberry32(999);
  drawTree(tr2, 428, 196, -Math.PI/2, 26, 4, 8, '#0c0816');
  // small shrub
  const tr3 = mulberry32(1234);
  drawTree(tr3, 462, 205, -Math.PI/2, 13, 2, 5, '#0b0714');

  /* ================= HOUSE ================= */
  const wall     = '#171126';
  const wallDark = '#0e0a1a';
  const roof     = '#0a0714';
  const rimCold  = '#241d3a';

  // walls
  rect(132, 116, 88, 76, wall);
  rect(192, 116, 28, 76, wallDark);
  // faint clapboard lines
  for(let y=122;y<192;y+=6){
    rect(132, y, 88, 1, 'rgba(0,0,0,0.30)');
  }

  // roof
  ptri(120, 122, 176, 62, 232, 122, roof);
  // roof shingle hint
  for(let i=1;i<9;i++){
    const y = 62 + i*7;
    const halfW = (y-62)/(122-62) * 56;
    rect(176 - halfW + 2, y, halfW*2 - 4, 1, 'rgba(255,255,255,0.018)');
  }
  // cold rim on the right slope
  pline(177, 63, 232, 121, rimCold, 1);
  // dark left slope edge
  pline(175, 63, 120, 121, '#040309', 1);
  // eaves shadow
  rect(118, 120, 116, 4, '#05030c');

  // chimney
  rect(200, 55, 13, 46, wall);
  rect(198, 51, 17, 5,  roof);
  pline(213, 55, 213, 98, rimCold, 1);
  rect(200, 96, 13, 3, 'rgba(0,0,0,0.5)');

  // door
  rect(162, 158, 24, 32, '#0a0613');
  rect(162, 156, 24, 2,  '#05030c');
  pcircle(174, 158, 12, '#0a0613');
  // door rim
  pline(185, 160, 185, 190, '#1d1730', 1);
  // knob
  rect(181, 174, 2, 2, '#3a3050');

  /* ================= TOMBSTONES ================= */
  tombstone(276, 200, 9, 14, -0.10);
  tombstone(298, 206, 8, 11,  0.06);
  tombstone(322, 198, 7, 16,  0.12);
  tombstone(352, 208, 9, 12, -0.08);
  tombstone(378, 202, 8, 15,  0.03);
  tombstone(404, 210, 7, 10, -0.14);
  // cross grave
  rect(340, 196, 2, 12, '#15101f');
  rect(336, 199, 10, 2, '#15101f');
  rect(341, 196, 1, 12, '#221b36');

  /* ================= GROUND DETAIL ================= */
  for(let i=0;i<90;i++){
    const x = R()*W;
    const y = 186 + R()*(H-186);
    const h = 1 + Math.round(R()*2);
    sctx.fillStyle = R() < 0.6 ? '#0a0714' : '#100c1c';
    sctx.fillRect(x|0, y|0, 1, h);
  }
  // a few small rocks
  for(let i=0;i<16;i++){
    const x = R()*W, y = 200 + R()*(H-200);
    sctx.fillStyle = '#100c1c';
    sctx.fillRect(x|0, y|0, 2 + (R()*3|0), 1 + (R()*2|0));
  }

  cur = ctx;
}
buildStatic();

/* =========================================================
   STARS
   ========================================================= */
const stars = (function(){
  const R = mulberry32(4242);
  const a = [];
  for(let i=0;i<70;i++){
    a.push({
      x: R()*W,
      y: R()*150,
      p: R()*Math.PI*2,
      s: 0.6 + R()*1.8,
      b: 0.25 + R()*0.6
    });
  }
  return a;
})();

/* =========================================================
   CLOUDS
   ========================================================= */
const clouds = (function(){
  const out = [];
  for(let i=0;i<8;i++){
    const r = mulberry32(500 + i*37);
    const puffs = [];
    const n  = 4 + Math.floor(r()*4);
    const cw = 46 + r()*70;
    for(let j=0;j<n;j++){
      puffs.push({
        dx: (j/(n-1) - 0.5)*cw + (r()-0.5)*16,
        dy: (r()-0.5)*8,
        rx: 12 + r()*18,
        ry: 5  + r()*7
      });
    }
    out.push({
      x: r()*W*1.5 - W*0.25,
      y: 12 + r()*100,
      spd: 1.4 + r()*3.2,
      puffs: puffs,
      alpha: 0.55 + r()*0.4,
      scale: 0.65 + r()*0.75,
      rim: r() < 0.4
    });
  }
  return out;
})();

/* =========================================================
   WINDOWS
   ========================================================= */
const windows = [
  { x:146, y:136, w:16, h:20, phase:0.0, speed:1.0 },
  { x:186, y:136, w:16, h:20, phase:2.1, speed:1.3 },
  { cx:175, cy:98, r:8, round:true, phase:4.2, speed:0.7 }
];

/* =========================================================
   PUMPKINS
   ========================================================= */
const pumpkins = [
  { x: 250, y: 196, s: 1.00, phase: 0.0 },
  { x: 104, y: 204, s: 0.85, phase: 2.3 },
  { x: 366, y: 218, s: 0.92, phase: 4.6 }
];

/* =========================================================
   PARTICLES
   ========================================================= */
const rain = [];
(function(){
  const R = mulberry32(31337);
  for(let i=0;i<130;i++){
    const layer = R() < 0.55 ? 0 : 1;
    rain.push({
      x: R()*W,
      y: R()*H,
      len: layer ? 4 + R()*4 : 7 + R()*6,
      spd: layer ? 105 + R()*65 : 175 + R()*95,
      a:   layer ? 0.10 + R()*0.14 : 0.16 + R()*0.24,
      w:   layer ? 0.13 : 0.20,
      l:   layer
    });
  }
})();

const sparks = [];
const smoke  = [];

function spawnSparks(dt, t){
  const fx = 320, fy = 234;
  const rate = 26;
  if(Math.random() < rate*dt){
    sparks.push({
      x: fx + (Math.random()-0.5)*10,
      y: fy - 4 - Math.random()*8,
      vx: (Math.random()-0.5)*10,
      vy: -18 - Math.random()*26,
      life: 0,
      max: 0.7 + Math.random()*1.2,
      size: Math.random() < 0.25 ? 2 : 1
    });
  }
}

function spawnSmoke(dt){
  // fire smoke
  if(Math.random() < 16*dt){
    smoke.push({
      x: 320 + (Math.random()-0.5)*8,
      y: 224 + Math.random()*4,
      vx: (Math.random()-0.5)*3,
      vy: -9 - Math.random()*7,
      r: 2 + Math.random()*2,
      grow: 5.5 + Math.random()*4,
      life: 0,
      max: 3.4 + Math.random()*2.4,
      a: 0.20 + Math.random()*0.14,
      col: '#2b2742'
    });
  }
  // chimney smoke
  if(Math.random() < 5.5*dt){
    smoke.push({
      x: 206 + (Math.random()-0.5)*4,
      y: 48,
      vx: 2.5 + (Math.random()-0.5)*2,
      vy: -7 - Math.random()*5,
      r: 1.6 + Math.random()*1.6,
      grow: 4.0 + Math.random()*3.5,
      life: 0,
      max: 5.5 + Math.random()*3.0,
      a: 0.16 + Math.random()*0.12,
      col: '#262244'
    });
  }
}

function updateParticles(dt, t){
  /* --- rain --- */
  for(let i=0;i<rain.length;i++){
    const p = rain[i];
    p.y += p.spd*dt;
    p.x += p.spd*p.w*dt;
    if(p.y > H + 6){
      p.y = -8 - Math.random()*14;
      p.x = Math.random()*W*1.15 - W*0.1;
    }
    if(p.x > W + 8) p.x -= W + 20;
  }

  /* --- sparks --- */
  for(let i=sparks.length-1;i>=0;i--){
    const s = sparks[i];
    s.life += dt;
    if(s.life >= s.max){ sparks.splice(i,1); continue; }
    s.vy += 14*dt;          // slight gravity
    s.vx += Math.sin(s.life*7 + s.y*0.3)*16*dt; // flutter
    s.x += s.vx*dt;
    s.y += s.vy*dt;
  }

  /* --- smoke --- */
  for(let i=smoke.length-1;i>=0;i--){
    const p = smoke[i];
    p.life += dt;
    if(p.life >= p.max){ smoke.splice(i,1); continue; }
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.r += p.grow*dt;
    p.vx += Math.sin(p.life*1.6 + p.y*0.05)*3*dt;
    p.vy *= (1 - 0.25*dt);
  }

  spawnSparks(dt, t);
  spawnSmoke(dt);
}

/* =========================================================
   LIGHTNING
   ========================================================= */
let lightningTimer = 7 + Math.random()*9;
let lightningA = 0;

function updateLightning(dt){
  lightningTimer -= dt;
  if(lightningTimer <= 0){
    lightningTimer = 11 + Math.random()*20;
    lightningA = 0.85 + Math.random()*0.7;
  }
  if(lightningA > 0.001){
    lightningA *= Math.pow(0.014, dt);
  } else {
    lightningA = 0;
  }
}

/* =========================================================
   DRAW : SKY
   ========================================================= */
const skyGrad = (function(){
  const g = ctx.createLinearGradient(0,0,0,HORIZON+22);
  g.addColorStop(0,    '#04040d');
  g.addColorStop(0.40, '#0a091d');
  g.addColorStop(0.72, '#161231');
  g.addColorStop(0.90, '#221a3c');
  g.addColorStop(1,    '#2c2247');
  return g;
})();

function drawSky(){
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,W,HORIZON+22);
}

function drawStars(t){
  for(let i=0;i<stars.length;i++){
    const s = stars[i];
    const tw = 0.55 + 0.45*Math.sin(t*s.s + s.p);
    const a  = s.b * tw;
    if(a < 0.03) continue;
    ctx.fillStyle = 'rgba(200,215,255,'+a.toFixed(3)+')';
    ctx.fillRect(s.x|0, s.y|0, 1, 1);
  }
}

function drawMoon(t){
  const mx = 398, my = 54, mr = 15;
  // disc
  pcircle(mx, my, mr, '#c9c6dd');
  pcircle(mx, my, mr-1, '#ded9ec');
  // craters
  ctx.fillStyle = 'rgba(150,148,178,0.55)';
  ctx.fillRect(mx-6, my-4, 4, 4);
  ctx.fillRect(mx+3, my+2, 3, 3);
  ctx.fillRect(mx-2, my+6, 2, 2);
  ctx.fillRect(mx+5, my-7, 2, 2);
  // halo behind clouds
  ctx.globalCompositeOperation = 'lighter';
  addGlow(mx, my, 74, '150,175,255', 0.16);
  ctx.globalCompositeOperation = 'source-over';
}

function drawClouds(t){
  for(let i=0;i<clouds.length;i++){
    const c = clouds[i];
    let cx = c.x + t*c.spd;
    const span = W + 300;
    cx = ((cx % span) + span) % span - 150;

    ctx.globalAlpha = c.alpha;
    for(let j=0;j<c.puffs.length;j++){
      const p = c.puffs[j];
      const px = cx + p.dx*c.scale;
      const py = c.y  + p.dy*c.scale;
      const rx = p.rx*c.scale;
      const ry = p.ry*c.scale;

      pellipse(px, py, rx, ry, '#0f0d23');

      if(c.rim){
        // thin cold rim on the upper edge
        for(let dy=-Math.round(ry); dy < -Math.round(ry)+2; dy++){
          const k = 1 - (dy*dy)/(ry*ry);
          if(k < 0) continue;
          const dx = Math.floor(rx*Math.sqrt(k));
          ctx.fillStyle = 'rgba(120,140,200,0.10)';
          ctx.fillRect(Math.round(px)-dx, Math.round(py)+dy, dx*2+1, 1);
        }
      }
    }
    ctx.globalAlpha = 1;
  }
  // moon glow bleeding through the clouds
  ctx.globalCompositeOperation = 'lighter';
  addGlow(398, 54, 90, '120,150,240', 0.10);
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   DRAW : ATMOSPHERE
   ========================================================= */
function drawFog(t){
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<4;i++){
    const y  = 178 + i*16 + Math.sin(t*0.25 + i)*2;
    const a  = 0.030 + 0.012*Math.sin(t*0.4 + i*2.1);
    const g  = ctx.createLinearGradient(0, y-10, 0, y+14);
    g.addColorStop(0,   'rgba(70,95,150,0)');
    g.addColorStop(0.5, 'rgba(70,95,150,'+a+')');
    g.addColorStop(1,   'rgba(70,95,150,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, y-10, W, 24);
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   DRAW : HOUSE LIGHTS
   ========================================================= */
function drawWindowPane(w, f){
  f = clamp01(f);
  const r = Math.round(255*f);
  const g = Math.round(192*f);
  const b = Math.round(96*f);
  const col = 'rgb('+r+','+g+','+b+')';

  if(w.round){
    pcircle(w.cx, w.cy, w.r, col);
    rect(w.cx - w.r, w.cy, w.r*2+1, 1, '#1a1220');
    rect(w.cx, w.cy - w.r, 1, w.r*2+1, '#1a1220');
    // frame ring
    ctx.strokeStyle = 'rgba(0,0,0,0)'; // no-op, ring drawn below
    rect(w.cx - w.r - 1, w.cy, 1, 1, '#0d0917');
  } else {
    rect(w.x, w.y, w.w, w.h, col);
    // inner warm gradient hint
    rect(w.x, w.y, w.w, 3, 'rgba(255,255,255,0.18)');
    // mullions
    rect(w.x, w.y + (w.h>>1), w.w, 1, '#1a1220');
    rect(w.x + (w.w>>1), w.y, 1, w.h, '#1a1220');
    // frame
    rect(w.x-1, w.y-1, w.w+2, 1, '#0d0917');
    rect(w.x-1, w.y+w.h, w.w+2, 1, '#0d0917');
    rect(w.x-1, w.y-1, 1, w.h+2, '#0d0917');
    rect(w.x+w.w, w.y-1, 1, w.h+2, '#0d0917');
  }
}

function drawHouseLights(t){
  /* glow pass */
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<windows.length;i++){
    const w = windows[i];
    const f = clamp01(flicker(t, w.phase, w.speed));
    const cx = w.round ? w.cx : w.x + w.w/2;
    const cy = w.round ? w.cy : w.y + w.h/2;
    const base = w.round ? w.r : Math.max(w.w, w.h)*0.75;
    addGlow(cx, cy, base*3.0, '255,150,60', 0.30*f);
    addGlow(cx, cy, base*1.3, '255,200,120', 0.24*f);
  }
  ctx.globalCompositeOperation = 'source-over';

  /* pane pass */
  for(let i=0;i<windows.length;i++){
    const w = windows[i];
    const f = clamp01(flicker(t, w.phase, w.speed));
    drawWindowPane(w, f);
  }
}

/* =========================================================
   DRAW : PUMPKINS
   ========================================================= */
function drawPumpkin(p, t){
  const x = p.x, y = p.y, s = p.s;
  const f = clamp01(flicker(t, p.phase, 1.5));
  const rx = Math.round(7*s), ry = Math.round(6*s);

  /* glow */
  ctx.globalCompositeOperation = 'lighter';
  addGlow(x, y, 40*f, '255,120,30', 0.34*f);
  addGlow(x, y-2, 18*f, '255,180,80', 0.26*f);
  ctx.globalCompositeOperation = 'source-over';

  /* body */
  pellipse(x, y, rx, ry, '#a8460c');
  pellipse(x, y-1, rx-1, ry-2, '#cc5f14');
  pellipse(x-1, y-2, rx-3, ry-3, '#dd7420');
  /* ridges */
  rect(x-rx+1, y-ry+2, 1, ry*2-4, '#8f3a07');
  rect(x+rx-1, y-ry+2, 1, ry*2-4, '#8f3a07');
  /* stem */
  rect(x-1, y-ry-3, 3, 4, '#3d3a1e');
  rect(x,   y-ry-4, 2, 1, '#4a4626');

  /* face */
  const fc = 'rgb('+Math.round(255*f)+','+Math.round(200*f)+','+Math.round(90*f)+')';
  ptri(x-4, y-2, x-2, y-2, x-3, y-4, fc);
  ptri(x+2, y-2, x+4, y-2, x+3, y-4, fc);
  rect(x-1, y-1, 2, 2, fc);
  rect(x-4, y+1, 8, 1, fc);
  rect(x-4, y+1, 1, 2, fc);
  rect(x+3, y+1, 1, 2, fc);
  rect(x-2, y+2, 1, 1, '#2a1004');
  rect(x+1, y+2, 1, 1, '#2a1004');
}

/* =========================================================
   DRAW : BONFIRE + CAT
   ========================================================= */
function drawFire(t){
  const fx = 320, fy = 236;
  const f  = clamp01(fireFlicker(t, 0.7));

  /* glow */
  ctx.globalCompositeOperation = 'lighter';
  addGlow(fx, fy-8,  86*f, '255,110,25', 0.30*f);
  addGlow(fx, fy-6,  46*f, '255,150,60', 0.32*f);
  addGlow(fx, fy-4,  22*f, '255,210,120', 0.34*f);
  ctx.globalCompositeOperation = 'source-over';

  /* logs */
  rect(fx-10, fy-1, 20, 3, '#180f07');
  rect(fx-8,  fy-3, 16, 2, '#241608');
  rect(fx-6,  fy-5, 12, 2, '#2c1c0a');

  /* outer flames */
  for(let i=0;i<6;i++){
    const p  = i/5;
    const ph = i*1.7;
    const h  = (11 + Math.sin(t*9.2 + ph)*4.5) * (1 - Math.abs(p-0.5)*0.85);
    const w  = 3.2 - Math.abs(p-0.5)*4;
    const x  = fx - 8 + i*3.2;
    const sway = Math.sin(t*6.1 + ph)*1.8;
    ptri(x-w, fy-3, x+w, fy-3, x+sway, fy-3-h, '#e8570c');
  }
  /* mid flames */
  for(let i=0;i<5;i++){
    const p  = i/4;
    const ph = i*2.3;
    const h  = (9 + Math.sin(t*12.5 + ph)*3.6) * (1 - Math.abs(p-0.5)*0.9);
    const w  = 2.4 - Math.abs(p-0.5)*3;
    const x  = fx - 6 + i*3;
    const sway = Math.sin(t*8.3 + ph)*1.4;
    ptri(x-w, fy-3, x+w, fy-3, x+sway, fy-3-h, '#ff8c1a');
  }
  /* hot core */
  for(let i=0;i<4;i++){
    const ph = i*2.9;
    const h  = 6.5 + Math.sin(t*15.7 + ph)*2.6;
    const x  = fx - 4 + i*2.6;
    ptri(x-1.6, fy-3, x+1.6, fy-3, x + Math.sin(t*11 + ph)*0.9, fy-3-h, '#ffc247');
  }
  /* brightest tip */
  ptri(fx-1.6, fy-4, fx+1.6, fy-4, fx + Math.sin(t*17)*0.8, fy-11 + Math.sin(t*19)*1.6, '#fff0b8');

  /* ---- black cat ---- */
  const cx = 336, cy = 235;
  pellipse(cx, cy-3, 4.5, 4, '#050308');       // body
  pcircle(cx, cy-8, 3, '#050308');             // head
  ptri(cx-3, cy-10, cx-1, cy-10, cx-2.4, cy-13, '#050308'); // ear L
  ptri(cx+1, cy-10, cx+3, cy-10, cx+2.4, cy-13, '#050308'); // ear R
  // tail
  pline(cx+4, cy-3, cx+8, cy-7, '#050308', 1);
  pline(cx+8, cy-7, cx+9, cy-11, '#050308', 1);
  // eyes (catching firelight)
  const eg = Math.round(120 + 90*f);
  ctx.fillStyle = 'rgb(255,'+eg+',40)';
  ctx.fillRect(cx-2, cy-8, 1, 1);
  ctx.fillRect(cx+1, cy-8, 1, 1);
}

/* =========================================================
   DRAW : PARTICLES
   ========================================================= */
function drawSmoke(){
  for(let i=0;i<smoke.length;i++){
    const p = smoke[i];
    const k = p.life / p.max;
    const a = p.a * (1 - k) * (k < 0.15 ? k/0.15 : 1);
    if(a <= 0.008) continue;
    ctx.globalAlpha = a;
    pcircle(p.x, p.y, p.r, p.col);
  }
  ctx.globalAlpha = 1;
}

function drawSparks(){
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<sparks.length;i++){
    const s = sparks[i];
    const k = 1 - s.life/s.max;
    if(k <= 0) continue;
    const g = Math.round(110 + 145*k);
    const b = Math.round(60*k*k);
    ctx.fillStyle = 'rgba(255,'+g+','+b+','+k.toFixed(3)+')';
    ctx.fillRect(s.x|0, s.y|0, s.size, s.size);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawRain(){
  for(let i=0;i<rain.length;i++){
    const p = rain[i];
    ctx.fillStyle = 'rgba(150,180,225,'+p.a.toFixed(3)+')';
    const n = p.len|0;
    for(let j=0;j<n;j++){
      const px = Math.round(p.x - j*p.w);
      const py = Math.round(p.y - j);
      if(py < 0 || py >= H || px < 0 || px >= W) continue;
      ctx.fillRect(px, py, 1, 1);
    }
  }
}

/* =========================================================
   DRAW : LIGHTNING + VIGNETTE
   ========================================================= */
function drawLightning(){
  if(lightningA <= 0.004) return;
  const f = lightningA * (0.45 + Math.random()*0.55);
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(140,170,255,'+(f*0.30).toFixed(3)+')';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'source-over';
}

const vignetteGrad = (function(){
  const g = ctx.createRadialGradient(W/2, H*0.55, H*0.32, W/2, H*0.55, H*1.02);
  g.addColorStop(0,   'rgba(0,0,0,0)');
  g.addColorStop(0.6, 'rgba(0,0,0,0.22)');
  g.addColorStop(1,   'rgba(0,0,0,0.72)');
  return g;
})();

function drawVignette(){
  ctx.fillStyle = vignetteGrad;
  ctx.fillRect(0,0,W,H);
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render(t){
  cur = ctx;

  drawSky();
  drawStars(t);
  drawMoon(t);
  drawClouds(t);

  ctx.drawImage(S, 0, 0);

  drawFog(t);

  drawHouseLights(t);

  for(let i=0;i<pumpkins.length;i++) drawPumpkin(pumpkins[i], t);

  drawFire(t);

  drawSmoke();
  drawSparks();
  drawRain();

  drawLightning();
  drawVignette();
}

/* =========================================================
   LOOP  (capped at ~30fps — pixel-art cadence, low CPU)
   ========================================================= */
let last = performance.now();
let acc  = 0;
let time = 0;
const FRAME = 1/30;

function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.12) dt = 0.12;

  acc += dt;
  if(acc < FRAME) return;

  const step = acc;
  acc = 0;
  time += step;

  updateParticles(step, time);
  updateLightning(step);
  render(time);
}

requestAnimationFrame(loop);

})();
</script>
